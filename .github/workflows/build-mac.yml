# Fabrica los instaladores de macOS (.dmg) y los adjunta al release.
#
# Se ejecuta solo:
#   - al publicar un release en GitHub (adjunta los .dmg a ese release), o
#   - a mano: pestaña Actions -> "Instalador macOS" -> Run workflow (pide el tag, p. ej. v1.20.85).
#
# Firma opcional (sin esto el .dmg funciona igual, pero macOS pide "clic derecho > Abrir" la 1a vez):
#   Secrets del repo: DEVELOPER_ID  = "Developer ID Application: Tu Nombre (TEAMID)"
#                     MACOS_CERT_P12 (base64 del .p12) y MACOS_CERT_PASSWORD
name: Instalador macOS
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release al que adjuntar los .dmg (p. ej. v1.20.84)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        arch: arm64  }   # Apple Silicon (M1/M2/M3/M4)
          - { os: macos-15-intel,  arch: x86_64 }   # Mac con Intel
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pywebview -r app_servidor/requirements.txt
          brew install create-dmg
      - name: Certificado de firma (opcional)
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.MACOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Fabricar .app y .dmg
        working-directory: constructor_instalador_mac
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          OUT_DIR: ${{ github.workspace }}/dmg
          PYTHON: python
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: Prueba completa de la app (ventanas reales, con capturas)
        run: |
          APP="constructor_instalador_mac/dist/Cinema Reservas.app/Contents/MacOS/CinemaReservas"
          "$APP" --uitest "$RUNNER_TEMP/uitest" 2>&1 | tee "$RUNNER_TEMP/uitest.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Guardar capturas de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-mac-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/uitest
            ${{ runner.temp }}/uitest.log
          retention-days: 14
      - name: Adjuntar al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dmg/*.dmg --clobber --repo "${{ github.repository }}"
      - name: Prueba de actualizacion automatica (version vieja simulada)
        run: |
          SRC="constructor_instalador_mac/dist/Cinema Reservas.app"
          DEST="$HOME/Applications/Cinema Reservas.app"
          EXE="$DEST/Contents/MacOS/CinemaReservas"
          mkdir -p "$HOME/Applications"; rm -rf "$DEST"; ditto "$SRC" "$DEST"
          touch "$DEST/Contents/MARCA_VERSION_VIEJA"            # desaparece si la app se reemplaza
          CP_MANAGED_INSTALL=1 CP_DEV_NO_LICENSE=1 CP_NO_BROWSER=1 CP_TEST_LOCAL_VERSION=1.0.0 \
            "$EXE" --server > "$RUNNER_TEMP/srv_upd.log" 2>&1 &
          for i in $(seq 1 90); do curl -sk --max-time 3 https://localhost:8001/api/ | grep -q "Cinema" && break; sleep 1; done
          CHK=$(curl -sk "https://localhost:8001/api/updates/check?refresh=true"); echo "$CHK"
          echo "$CHK" | grep -q '"has_update":true' || { echo "FALLO: no detecto la actualizacion"; tail -20 "$RUNNER_TEMP/srv_upd.log"; exit 1; }
          APPLY=$(curl -sk --max-time 600 -X POST -H "Content-Type: application/json" -H "Origin: https://localhost:8001" \
                  -d '{}' https://localhost:8001/api/updates/apply-and-restart); echo "$APPLY"
          echo "$APPLY" | grep -q '"restarted":true' || { echo "FALLO: no se instalo sola"; exit 1; }
          for i in $(seq 1 180); do [ -d "$DEST" ] && [ ! -e "$DEST/Contents/MARCA_VERSION_VIEJA" ] && break; sleep 1; done
          [ -d "$DEST" ] && [ ! -e "$DEST/Contents/MARCA_VERSION_VIEJA" ] || { echo "FALLO: la app no se reemplazo"; exit 1; }
          echo "version instalada: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$DEST/Contents/Info.plist")"
          sleep 10
          if pgrep -f "$EXE" >/dev/null; then echo "OK: la app nueva se volvio a abrir sola"; else echo "FALLO: la app no se reabrio"; exit 1; fi
          pkill -f "$EXE" || true
          echo "RESULTADO ACTUALIZACION: OK"
