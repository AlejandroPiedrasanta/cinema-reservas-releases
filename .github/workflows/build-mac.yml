# Fabrica los instaladores de macOS (.dmg) y los adjunta al release.
#
# Se ejecuta solo:
#   - al publicar un release en GitHub (adjunta los .dmg a ese release), o
#   - a mano: pestaña Actions -> "Instalador macOS" -> Run workflow (pide el tag, p. ej. v1.20.85).
#
# Firma opcional (sin esto el .dmg funciona igual, pero macOS pide "clic derecho > Abrir" la 1a vez):
#   Secrets del repo: DEVELOPER_ID  = "Developer ID Application: Tu Nombre (TEAMID)"
#                     MACOS_CERT_P12 (base64 del .p12) y MACOS_CERT_PASSWORD
name: Instalador macOS
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release al que adjuntar los .dmg (p. ej. v1.20.84)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,        arch: arm64  }   # Apple Silicon (M1/M2/M3/M4)
          - { os: macos-15-intel,  arch: x86_64 }   # Mac con Intel
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pywebview -r app_servidor/requirements.txt
          brew install create-dmg
      - name: Certificado de firma (opcional)
        if: env.MACOS_CERT_P12 != ''
        run: |
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.MACOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Fabricar .app y .dmg
        working-directory: constructor_instalador_mac
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          OUT_DIR: ${{ github.workspace }}/dmg
          PYTHON: python
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: Adjuntar al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dmg/*.dmg --clobber --repo "${{ github.repository }}"
